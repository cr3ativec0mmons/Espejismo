[package]
name = "espejismo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Interfaz de escritorio para ADB y scrcpy"
default-run = "espejismo"

[features]
default = []
gui = ["dep:gio", "dep:gtk4", "dep:libadwaita", "dep:qrcode"]

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

gio = { package = "gio", version = "0.21", optional = true }
gtk4 = { version = "0.11", features = ["v4_10"], optional = true }
libadwaita = { version = "0.9", features = ["v1_7", "gtk_v4_10"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "allow"