<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="phone-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="screen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0d9f9"/>
      <stop offset="1" stop-color="#78aeed"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo del teléfono -->
  <rect x="30" y="8" width="68" height="112" rx="12" ry="12"
        fill="url(#phone-bg)"/>

  <!-- Pantalla -->
  <rect x="36" y="20" width="56" height="88" rx="4" ry="4"
        fill="url(#screen-bg)"/>

  <!-- Línea espejo (mitad de la pantalla) -->
  <line x1="36" y1="64" x2="92" y2="64"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Contenido superior: barras representando interfaz -->
  <rect x="46" y="33" width="36" height="5" rx="2.5" fill="white" opacity="0.85"/>
  <rect x="46" y="43" width="26" height="4" rx="2" fill="white" opacity="0.65"/>
  <rect x="46" y="51" width="32" height="4" rx="2" fill="white" opacity="0.70"/>

  <!-- Reflejo inferior (simétrico, desvanecido) -->
  <rect x="46" y="93" width="36" height="5" rx="2.5" fill="white" opacity="0.38"/>
  <rect x="46" y="84" width="26" height="4" rx="2" fill="white" opacity="0.28"/>
  <rect x="46" y="76" width="32" height="4" rx="2" fill="white" opacity="0.32"/>

  <!-- Barra home -->
  <rect x="51" y="108" width="26" height="4" rx="2"
        fill="white" opacity="0.50"/>
</svg>
